{% extends "membership/base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h2>Dashboard</h2>

<div class="col-md-3">
    <a href="{% url 'event_list' %}" class="text-decoration-none">

        <div class="card shadow-sm text-center">

            <div class="card-body">

                <i class="fas fa-calendar-alt fa-3x text-primary"></i>

                <h5 class="mt-3">Events</h5>

                <small>Event Management</small>

            </div>

        </div>

    </a>
</div>


<div class="row mt-4">

    <div class="col-md-3">
        <div class="card text-bg-primary">
            <div class="card-body">
                <h5>Total Members</h5>
                <h2>0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-success">
            <div class="card-body">
                <h5>Active Members</h5>
                <h2>0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-warning">
            <div class="card-body">
                <h5>Expired</h5>
                <h2>0</h2>
            </div>
        </div>
    </div>

    <div class="col-md-3">
        <div class="card text-bg-danger">
            <div class="card-body">
                <h5>Renewal Due</h5>
                <h2>0</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
